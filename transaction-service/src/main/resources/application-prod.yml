# Production profile: activate with SPRING_PROFILES_ACTIVE=prod
# Swagger UI and the OpenAPI spec are not exposed in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  jpa:
    show-sql: false

logging:
  level:
    com.minibank: INFO
    org.hibernate.SQL: WARN
