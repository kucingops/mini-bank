server:
  port: 8082

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/minibank_bank
    username: minibank
    password: minibank123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100   # cap ?size= on paginated endpoints
    redis:
      host: localhost
      port: 6379

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${spring.data.redis.host}:${spring.data.redis.port}"

# Redis Stream configuration
redis:
  stream:
    transfer-requested: transfer-requested
    transfer-validated: transfer-validated
    transfer-rejected: transfer-rejected
    consumer-group: transaction-service-group

jwt:
  secret: ${JWT_SECRET:minibank-jwt-secret-key-change-in-production-2026}

logging:
  level:
    com.minibank: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  writer-with-order-by-keys: true   # deterministic spec output (docs/openapi/*.json)
  default-produces-media-type: application/json
  swagger-ui:
    persist-authorization: true     # keep the JWT across page reloads and definition switches
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Origins allowed to call this service from a browser (the combined Swagger UI lives on account-service)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
